server:
  http_listen_port: 9080
  grpc_listen_port: 0
positions:
  filename: /tmp/positions.yaml
clients:
  - url: http://loki:3100/loki/api/v1/push
scrape_configs:
  - job_name: qlsv-json
    static_configs:
      - targets: [localhost]
        labels:
          job: qlsv
          service: app
          __path__: /var/log/qlsv/*.log
    pipeline_stages:
      - json:
          expressions:
            level: level
            method: method
            status: status
      - labels:
          level:
          method:
